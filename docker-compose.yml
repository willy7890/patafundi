version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: patafundi_postgres
    environment:
      POSTGRES_USER: patafundi
      POSTGRES_PASSWORD: patafundi_secret
      POSTGRES_DB: patafundi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patafundi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: patafundi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patafundi_backend
    environment:
      DATABASE_URL: postgresql://patafundi:patafundi_secret@postgres:5432/patafundi
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-production-patafundi-2024
      PAYMENT_MODE: development
      INFRASTRUCTURE_MODE: FREE
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: patafundi_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  uploads_data:
